<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>1pxの謎 第2問「雛人形」</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <p class="puzzle-number">1pxの謎 第2問</p>
  <p class="intro">段飾りの前で、持ち主の行方が分からなくなった。<br>3つの手がかりから、その所在を突き止めよう。</p>

  <div class="scene-wrap" id="scene">
    <img class="scene-img" src="assets/base_scene.png" alt="雛人形の段飾りと屏風">

    <button class="hotspot" id="hs-fuda" data-key="fuda" style="left:62%; top:39%; width:12%; height:7%;" aria-label="段の隅の木札を調べる">
      <span class="hotspot-badge" aria-hidden="true"></span>
    </button>
    <button class="hotspot" id="hs-tsuzumi" data-key="tsuzumi" style="left:44%; top:49%; width:12%; height:7%;" aria-label="雛道具の鼓を調べる">
      <span class="hotspot-badge" aria-hidden="true"></span>
    </button>
    <button class="hotspot" id="hs-byobu" data-key="byobu" style="left:74%; top:31%; width:20%; height:39%;" aria-label="屏風を調べる">
      <span class="hotspot-badge" aria-hidden="true"></span>
    </button>

    <div class="dropzone" id="dropzone" style="left:37%; top:5%; width:18%; height:7%;" aria-hidden="true"></div>

    <img class="item" id="item" src="assets/item_key.png" alt="古びた鍵" style="left:45%; top:90%;" draggable="false" hidden>
  </div>

  <div class="progress-row">
    <div class="progress" id="progress" aria-hidden="true">
      <span class="dot" data-key="fuda"></span>
      <span class="dot" data-key="tsuzumi"></span>
      <span class="dot" data-key="byobu"></span>
    </div>
    <button type="button" class="hint-link" id="hint-btn">ヒント</button>
  </div>
  <p class="hint-text" id="hint-text" role="status"></p>

  <section class="code-section" id="code-section" hidden>
    <p>3つの手がかりから、答えを導き出せ。</p>
    <form id="code-form" autocomplete="off">
      <input type="text" id="code-input" maxlength="4" placeholder="＿＿＿＿" aria-label="ひらがな4文字で入力">
      <button type="submit">ロック解除</button>
    </form>
    <p class="code-feedback" id="code-feedback" role="status"></p>
  </section>

  <p class="drag-hint" id="drag-hint" hidden>鍵を、天井の点検口まで運んでみよう。</p>

  <div class="clear-screen" id="clear-screen" hidden>
    <p class="puzzle-number">第2問 クリア</p>
    <h2>天井の奥に、人の形があった。</h2>
    <p>——見つけた1pxは、まだ何も答えてくれない。</p>
    <a href="https://note.com/" target="_blank" rel="noopener">→ 気になる方はこちら</a>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <button class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
    <img id="modal-img" src="" alt="手がかり">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
